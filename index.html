<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BAHLIL IRENG</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#000;
      --fg:#e9f5ff;
      --muted:#9aa3a7;
      --neon:#00ffe5;
      --card:#07090c;
    }
    html,body{height:100%}
    body{
      background:
        radial-gradient(1200px 800px at 10% -10%,rgba(0,255,234,0.06),transparent 60%),
        radial-gradient(900px 600px at 120% 120%,rgba(0,179,255,0.07),transparent 55%),
        var(--bg);
      color:var(--fg);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }

    /* Kanvas efek hujan api */
    #embers, #heat{
      position:fixed;inset:0;z-index:0;pointer-events:none;
    }
    /* Heat haze tipis di atas api */
    #heat{mix-blend-mode:screen; opacity:.35;}

    .stage{
      position:relative;z-index:1;
      width:min(92vw,880px);
      padding:clamp(16px,3vw,28px);
      backdrop-filter: blur(6px);
      background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.06);
      border-radius:16px;
      box-shadow:0 15px 50px rgba(0,0,0,.65), inset 0 0 60px rgba(255,255,255,0.02);
      text-align:center;
    }

    .photo-wrap{
      position:relative;margin:0 auto 18px;
      width:min(86vw,520px);aspect-ratio:1/1;
      border-radius:14px;overflow:hidden;background:#0b0e12;
      border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 0 0 3px rgba(0,255,229,0.05), 0 0 45px rgba(0,255,229,0.2);
      transform-style:preserve-3d;
      transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
    }
    .photo-wrap:hover{
      transform: perspective(900px) rotateX(6deg) rotateY(-6deg) translateY(-2px);
      box-shadow:0 0 0 3px rgba(0,255,229,0.1), 0 30px 80px rgba(0,255,229,0.18);
    }
    .photo{
      width:100%;height:100%;object-fit:cover;display:block;
      filter: contrast(1.06) saturate(1.06);
    }
    /* Vignette + scanline */
    .photo-wrap::before,.photo-wrap::after{content:"";position:absolute;inset:0;pointer-events:none}
    .photo-wrap::before{
      background:
        radial-gradient(120% 100% at 50% 120%,rgba(0,0,0,.55),transparent 50%),
        radial-gradient(120% 100% at 50% -10%,rgba(0,0,0,.35),transparent 45%);
      mix-blend-mode:multiply;
    }
    .photo-wrap::after{
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 3px);
      opacity:.16; animation:scan 6s linear infinite;
    }
    @keyframes scan{0%{transform:translateY(-3%)}50%{transform:translateY(3%)}100%{transform:translateY(-3%)}}

    .title{
      font-size:clamp(22px,3.8vw,36px);
      letter-spacing:.6px;color:var(--neon);
      text-shadow:0 0 8px var(--neon), 0 0 18px rgba(0,255,229,.35);
      display:inline-block;border-right:2px solid rgba(0,255,229,.8);
      white-space:nowrap;overflow:hidden;
      animation:type 2.4s steps(24,end) .2s both, caret 650ms steps(1) infinite;
    }
    @keyframes type{from{width:0}to{width:100%}}
    @keyframes caret{50%{border-color:transparent}}
    .subtitle{
      margin-top:8px;color:var(--muted);
      font-size:clamp(14px,2.6vw,18px);line-height:1.45;
      text-shadow: 0 0 6px rgba(0,179,255,.25);
    }

    .audio-pill{
      margin:14px auto 0;display:inline-flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      background:linear-gradient(90deg, rgba(0,255,229,.08), rgba(255,120,0,.12));
      font-size:14px;color:var(--fg);
      box-shadow: inset 0 0 40px rgba(255,120,0,.08);
    }
    .dot{width:9px;height:9px;border-radius:999px;background:#ffae00;
      box-shadow:0 0 10px #ffae00,0 0 20px #ff5e00;animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.2);opacity:1}}
    .hint{color:#ffb36b;margin-top:10px;font-size:13px;display:none}

    @media (max-width:560px){ .photo-wrap{width:88vw} }
  </style>
</head>
<body>
  <!-- HUJAN API -->
  <canvas id="embers"></canvas>
  <canvas id="heat"></canvas>

  <main class="stage" role="main" aria-label="Halaman efek api & autoplay">
    <div class="photo-wrap" id="photoWrap">
      <img class="photo" id="photo"
           src="https://gerbangbanten.co.id/wp-content/uploads/2025/10/image-14.png"
           alt="Foto Tengah" />
    </div>

    <h1 class="title">BAHLIL KONNTOL</h1>
    <p class="subtitle">HEHEHEHEHEH</p>

    <div class="audio-pill"><span class="dot"></span><span id="pillText">Memutar musik...</span></div>
    <div class="hint" id="hint">🔊 Browser memblokir autoplay. (Klik di mana saja jika muncul.)</div>

    <audio id="bgm"
      src="https://moral-peach-vdnvbs2bbq.edgeone.app/Slipknot%20-%20Psychosocial%20[OFFICIAL%20VIDEO]%20[HD]%20[5abamRO41fE].mp3"
      loop preload="auto" muted></audio>
  </main>

  <script>
    /* ===== HUJAN API: ember / sparks jatuh ===== */
    (function(){
      const c = document.getElementById('embers');
      const ctx = c.getContext('2d');
      const heat = document.getElementById('heat');
      const htx = heat.getContext('2d');

      let W,H,COUNT;
      function resize(){
        W = c.width = heat.width = innerWidth;
        H = c.height = heat.height = innerHeight;
        COUNT = Math.round(Math.min(240, W*H/9000)); // banyaknya ember
      }
      addEventListener('resize', resize); resize();

      const embers = [];
      function spawn(n=COUNT){
        embers.length = 0;
        for(let i=0;i<n;i++){
          embers.push(newEmber());
        }
      }
      function newEmber(){
        const r = Math.random();
        return {
          x: Math.random()*W,
          y: -Math.random()*H,
          vx: (Math.random()*0.6 - 0.3) + (Math.random()<.5? -0.2:0.2), // sedikit angin
          vy:  1.6 + Math.random()*2.6,
          g:   0.004 + Math.random()*0.008,
          size: 0.8 + Math.random()*2.2,
          life: 120 + Math.random()*240,
          hue:  15 + Math.random()*30, // oranye kemerahan
          heat: 0.6 + Math.random()*0.4,
          flick: Math.random()*Math.PI*2
        }
      }
      spawn();

      function loop(){
        // Ember layer
        ctx.clearRect(0,0,W,H);
        ctx.globalCompositeOperation='lighter';
        for(let i=0;i<embers.length;i++){
          const p = embers[i];
          p.vy += p.g;
          p.x += p.vx + Math.sin((p.flick+=0.15))*0.15; // goyang api
          p.y += p.vy;
          p.life -= 1;
          // glow warna api
          const grd = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*5);
          grd.addColorStop(0, `hsla(${p.hue},100%,60%,${0.28*p.heat})`);
          grd.addColorStop(1, `hsla(${p.hue+20},100%,50%,0)`);
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2);
          ctx.fill();

          // inti bara
          ctx.fillStyle = `hsla(${p.hue},100%,65%,.85)`;
          ctx.beginPath();
          ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
          ctx.fill();

          if(p.y > H + 20 || p.life<=0){
            embers[i] = newEmber();
            embers[i].y = -10;
          }
        }

        // Heat haze tipis (vertical streaks)
        htx.clearRect(0,0,W,H);
        const stripes = 12;
        for(let i=0;i<stripes;i++){
          const x = (i/stripes)*W + Math.sin(perfNow*0.0008+i)*12;
          const grad = htx.createLinearGradient(x,0,x,H);
          grad.addColorStop(0, 'rgba(255,120,0,0.05)');
          grad.addColorStop(0.5, 'rgba(255,160,0,0.08)');
          grad.addColorStop(1, 'rgba(255,90,0,0.04)');
          htx.fillStyle = grad;
          htx.fillRect(x-1,0,2,H);
        }

        perfNow = performance.now();
        requestAnimationFrame(loop);
      }
      let perfNow = performance.now();
      loop();
    })();

    /* ===== Parallax tilt ringan di foto ===== */
    (function(){
      const wrap = document.getElementById('photoWrap');
      let rAF;
      function tilt(e){
        const b = wrap.getBoundingClientRect();
        const cx = b.left + b.width/2, cy = b.top + b.height/2;
        const dx = (e.clientX - cx) / (b.width/2);
        const dy = (e.clientY - cy) / (b.height/2);
        cancelAnimationFrame(rAF);
        rAF = requestAnimationFrame(()=>{
          wrap.style.transform =
            `perspective(900px) rotateX(${(-dy*6).toFixed(2)}deg) rotateY(${(dx*6).toFixed(2)}deg) translateY(-2px)`;
        });
      }
      wrap.addEventListener('mousemove', tilt);
      wrap.addEventListener('mouseleave', ()=>{ wrap.style.transform=''; });
    })();

    /* ===== Autoplay tanpa klik: muted -> play -> unmute + fade; retry jika gagal ===== */
    (function(){
      const audio = document.getElementById('bgm');
      const pillText = document.getElementById('pillText');
      const hint = document.getElementById('hint');

      // Set agresif agar autoplay lebih mungkin lolos
      audio.setAttribute('playsinline','');
      audio.muted = true;
      audio.volume = 1.0;

      async function tryPlay(){
        try{
          // Coba mainkan saat load (muted)
          await audio.play();
          // Saat sudah "playing", unmute + fade in cepat
          const fadeIn = ()=>{
            audio.muted = false;
            let v = 0.0;
            audio.volume = v;
            const step=()=>{ v=Math.min(1,v+.05); audio.volume=v; if(v<1) requestAnimationFrame(step); };
            step();
            pillText.textContent = 'Memutar musik...';
            hint.style.display='none';
          };
          if(audio.readyState>=2) fadeIn();
          else audio.addEventListener('playing', fadeIn, {once:true});
        }catch(e){
          // Jika masih diblokir, coba ulang sebentar lagi (tanpa klik)
          console.warn('Autoplay diblokir, retry sebentar...', e);
          let attempts = 0;
          const timer = setInterval(async ()=>{
            attempts++;
            try{
              await audio.play();
              audio.muted = false;
              audio.volume = 0.0;
              let v=0; const step=()=>{ v=Math.min(1,v+.06); audio.volume=v; if(v<1) requestAnimationFrame(step); };
              step();
              pillText.textContent='Memutar musik...';
              hint.style.display='none';
              clearInterval(timer);
            }catch(err){
              if(attempts>8){ // berhenti setelah beberapa kali
                clearInterval(timer);
                hint.style.display='block';
                pillText.textContent='Autoplay diblokir';
              }
            }
          }, 700);
        }
      }
      window.addEventListener('load', tryPlay, {once:true});
    })();
  </script>
</body>
</html>
